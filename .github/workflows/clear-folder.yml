name: Clear folder

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to clear
        type: choice
        options:
          - rejected
          - accepted
          - analysis.md
          - all
        default: rejected
      older_than_days:
        description: Folders only - delete files last changed more than N days ago (0 = everything). analysis.md is only reset when this is 0.
        type: string
        default: "0"

permissions:
  contents: write

jobs:
  clear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clear
        env:
          TARGET: ${{ inputs.target }}
          DAYS: ${{ inputs.older_than_days }}
        run: |
          set -euo pipefail
          [[ "$DAYS" =~ ^[0-9]+$ ]] || { echo "older_than_days must be a number"; exit 1; }
          cutoff=$(( $(date +%s) - DAYS * 86400 ))

          case "$TARGET" in
            rejected)    dirs="rejected";          reset_log=no ;;
            accepted)    dirs="accepted";          reset_log=no ;;
            analysis.md) dirs="";                  reset_log=yes ;;
            all)         dirs="rejected accepted"; reset_log=yes ;;
            *) echo "Unknown target: $TARGET"; exit 1 ;;
          esac

          for dir in $dirs; do
            git ls-files -z -- "$dir/" > /tmp/files.lst
            count=0
            while IFS= read -r -d '' f; do
              [ "$(basename "$f")" = ".gitkeep" ] && continue
              ts=$(git log -1 --format=%ct -- "$f")
              if [ "$DAYS" -eq 0 ] || [ "$ts" -lt "$cutoff" ]; then
                git rm -q -- "$f"
                count=$((count+1))
              fi
            done < /tmp/files.lst
            echo "Removed $count file(s) from $dir/"
            mkdir -p "$dir"
            [ -f "$dir/.gitkeep" ] || { touch "$dir/.gitkeep"; git add "$dir/.gitkeep"; }
          done

          if [ "$reset_log" = "yes" ]; then
            if [ "$DAYS" -ne 0 ]; then
              echo "Skipping analysis.md: table rows have no date, so the age filter cannot apply. Set older_than_days to 0 to reset it."
            else
              printf '%s\n' \
                "# Work Item Analysis Log" \
                "" \
                "Auto-generated by Claude when each work item enters the review pipeline." \
                "" \
                "| Work Item ID | Type | Name | State | Analysis | Remarks |" \
                "|---|---|---|---|---|---|" > analysis.md
              git add analysis.md
              echo "Reset analysis.md to the table header only"
            fi
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -qm "Clear $TARGET (older than $DAYS days)"
            git pull -q --rebase
            git push -q
          else
            echo "Nothing to change."
          fi
